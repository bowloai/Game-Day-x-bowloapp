<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Game Day x bowlo.app - Infographic</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
#container { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="container"></div>
<script src="https://unpkg.com/@antv/infographic@latest/dist/infographic.min.js"></script>
<script>
const infographic = new AntVInfographic.Infographic({
  container: '#container',
  width: '100%',
  height: '100%',
});

document.fonts?.ready.then(() => {
  infographic.render(`infographic sequence-snake-steps-compact-card

data
  title Game Day x bowlo.app
  desc Track every bowl. Analyse every end. Improve every game.
  sequences
    - label Set Up Your Game
      desc Enter opponent, venue, surface, and format in seconds. Choose your position and start recording.
      icon clipboard text
    - label Record Every Bowl
      desc Tap the 9-zone grid after each delivery. Log hand, line, weight, and outcome in real time.
      icon target
    - label Analyse Your Performance
      desc Heatmaps, effectiveness %, hand comparison, and tactical insights — after every end.
      icon chart bar

theme dark
  palette #22c55e #f59e0b #34d399
`);
}).catch((error) => {
  console.error('Error waiting for fonts to load:', error);
  infographic.render(`infographic sequence-snake-steps-compact-card

data
  title Game Day x bowlo.app
  desc Track every bowl. Analyse every end. Improve every game.
  sequences
    - label Set Up Your Game
      desc Enter opponent, venue, surface, and format in seconds. Choose your position and start recording.
      icon clipboard text
    - label Record Every Bowl
      desc Tap the 9-zone grid after each delivery. Log hand, line, weight, and outcome in real time.
      icon target
    - label Analyse Your Performance
      desc Heatmaps, effectiveness %, hand comparison, and tactical insights — after every end.
      icon chart bar

theme dark
  palette #22c55e #f59e0b #34d399
`);
});
</script>
</body>
</html>
